# ============================================================
# MiniURL 前端容器 nginx 配置（SPA 回退）
# 部署：Dockerfile COPY 到 /etc/nginx/conf.d/default.conf，
#       被 nginx:alpine 主配置 http 块 include 进来，故此处只写 server 块
# ============================================================

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：前端路由（/login /dashboard /links/:id/analytics）在 nginx 侧
    # 无对应物理文件，统一回落到 index.html 交给 React Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端容器不代理业务接口。若流量绕过主 nginx 直打到这里（如误配），
    # 显式 404 而非回退到 index.html，避免把 /api/ /s/ 当成前端路由吃掉
    location /api/ { return 404; }
    location /s/   { return 404; }
}

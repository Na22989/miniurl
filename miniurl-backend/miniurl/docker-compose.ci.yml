# ============================================================
# MiniURL CI 专用 compose override — 与 VM 模拟生产栈隔离
#
# 背景：job2（docker-compose-test）切到 self-hosted runner（VM）后，
#       VM 上已运行模拟生产栈（container_name=miniurl-*，端口 3306/6379/9191/80）。
#       若 job2 直接用 docker-compose.yml，会撞容器名 + 端口，且 down -v 会删生产数据卷。
#
# 隔离三件套：
#   1. COMPOSE_PROJECT_NAME（在 ci.yml 里设 miniurl-ci）→ 卷名/网络名加前缀，down -v 只清 CI 自己的卷
#   2. container_name 覆盖为 miniurl-ci-* → 容器名不与生产栈冲突
#   3. ports 用 !override 整体替换 → 避开 3306/6379/9191 已占用端口
#
# 注意：ports 数组在 override 里默认是「追加」不是「替换」，必须用 !override 标量替换，
#      否则 ["13306:3306"] 会和 base 的 ["3306:3306"] 叠加，照样撞端口。
# 用法：COMPOSE_PROJECT_NAME=miniurl-ci docker compose -f docker-compose.yml -f docker-compose.ci.yml ...
# ============================================================

services:

  mysql:
    container_name: miniurl-ci-mysql
    ports: !override
      - "13306:3306"

  redis:
    container_name: miniurl-ci-redis
    ports: !override
      - "16379:6379"

  miniurl-app:
    image: miniurl-app:ci            # 独立 tag，不覆盖生产栈用的 miniurl-app:latest
    container_name: miniurl-ci-app
    ports: !override
      - "19191:9191"
    environment:
      # CI 不起 nginx，base-url 直指 app 端口；生产栈才用 nginx:80 入口
      MINIURL_BASE_URL: http://localhost:19191

# ============================================================
# MiniURL Nginx 反向代理 + 限速配置
# 部署：docker compose 挂载到容器 /etc/nginx/nginx.conf:ro
# 生效：docker compose up -d 重建；改配置后 docker exec miniurl-nginx nginx -t 验证 + reload
# ============================================================

# ─────────── main 上下文 ───────────
# 整个配置文件分三层：main（本层）→ http → server/location
# main 层只有进程级指令

# worker 运行身份：nginx:alpine 镜像自带 nginx 用户（master 以 root 起，worker 降权）
user nginx;

# worker 数 = CPU 核数（auto 自动探测）
worker_processes auto;

# events：连接处理模型
events {
    worker_connections 1024;   # 每个 worker 最大并发连接数
}

# ─────────── http 上下文 ───────────
http {

    # MIME 类型映射表：静态资源能返回正确 Content-Type 全靠它，别漏
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 访问/错误日志格式（$http_x_forwarded_for 可看到真实客户端链路）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # sendfile：内核态直接搬运文件到 socket，省一次用户态拷贝（静态资源友好）
    sendfile on;

    # 客户端长连接超时
    keepalive_timeout 65;

    # gzip：对 JSON API 与前端静态资源（html/css/js）都有收益
    gzip on;
    gzip_types text/plain text/css text/html application/json application/javascript;
    gzip_min_length 1k;

    # ── 限速区域定义（必须在 http 上下文，server/location 里只能引用）──
    # key = 客户端 IP。用 $binary_remote_addr（紧凑二进制，IPv6 占 16 字节）而非 $remote_addr（文本，IPv6 占 39 字节）
    # 10m 共享内存约存 16 万个 key；rate=10r/s 是令牌桶的**平均速率**
    limit_req_zone $binary_remote_addr zone=miniurl_limit:10m rate=10r/s;

    # ── 后端 upstream ──
    # 用 compose 服务名 miniurl-app，容器网络内 DNS 自动解析
    upstream miniurl_app {
        # keepalive 32：复用与后端的 TCP 连接，避免每次请求新建连接
        # （必须配合 location 里的 proxy_http_version 1.1 + Connection ""）
        keepalive 32;
        server miniurl-app:9191;
    }

    # ── 前端 upstream ──
    # 用 compose 服务名 frontend，容器网络内 DNS 自动解析
    upstream miniurl_frontend {
        keepalive 32;
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # 以下 proxy 头对后端与前端上游通用，提到 server 层避免在 location 里重复；
        # location 里只写各自差异（proxy_pass 目标 + 限速 + 超时）

        # 透传原始 Host，后端据此生成绝对 URL
        proxy_set_header Host $host;
        # 客户端真实 IP：$remote_addr 此刻是 nginx 到上游网桥 IP（172.x），
        # 真实客户端 IP 只能靠这个头传给后端 —— 应用 NetUtil 取 IP 做限流/访问统计都依赖它
        proxy_set_header X-Real-IP $remote_addr;
        # 转发链路：nginx 把自身看到的客户端 IP 追加到已有 X-Forwarded-For 末尾
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 协议（http/https），后端据此判断是否走了 TLS
        proxy_set_header X-Forwarded-Proto $scheme;

        # 配合 upstream keepalive：复用上游连接必须 HTTP/1.1 并清空 Connection 头
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 健康检查**不做限速**：探活请求被限流会导致 Prometheus/编排误判服务不可用
        # location = 是精确匹配，优先级高于下面的 location
        location = /actuator/health {
            proxy_pass http://miniurl_app;
        }

        # /api/** 业务接口 → 后端
        location /api/ {
            proxy_pass http://miniurl_app;

            # 连接 / 读 / 写超时
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # 限速：burst=20 允许瞬时突发 20 个请求进入等待队列；
            # nodelay 不排队等待，立即放行（超出 burst 的请求直接返回 503）
            limit_req zone=miniurl_limit burst=20 nodelay;
        }

        # /s/** 短链重定向 → 后端（同样限速，防刷重定向）
        location /s/ {
            proxy_pass http://miniurl_app;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            limit_req zone=miniurl_limit burst=20 nodelay;
        }

        # 其余流量（前端页面 / 静态资源）→ 前端容器。
        # 不做限速：静态资源/HTML 限速会伤体验且无防刷意义；
        # SPA 回退由前端容器的 nginx（try_files → /index.html）处理
        location / {
            proxy_pass http://miniurl_frontend;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}

$kind: http-request
url: "{{baseUrl}}/api/link/delete"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id": 99999999999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('删除不存在ID应返回 42100', function () {
          pm.expect(pm.response.json().code).to.eql(42100);
      });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/api/link/create"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "longUrl": "not-a-url"
    }
scripts:

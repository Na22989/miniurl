$kind: http-example
request:
  url: "{{baseUrl}}/api/user/refresh"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "refreshToken": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 5263,
        "message": "string",
        "data": {
          "accessToken": "string"
        }
      }
order: 1000

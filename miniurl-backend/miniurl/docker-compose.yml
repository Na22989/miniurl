# ============================================================
# MiniURL docker-compose — MySQL + Redis + App 一键编排
#
# 使用：
#   docker compose up -d --build          # 一键构建 + 后台启动三容器
#   docker compose ps                      # 查看三容器状态（均应 Up + healthy）
#   docker compose logs -f miniurl-app     # 跟随应用日志
#   docker compose down                    # 停止并移除容器（不删数据卷）
#
# ============================================================

services:

  # ---------- MySQL 8.0 ----------
  mysql:
    image: mysql:8.0
    container_name: miniurl-mysql
    restart: unless-stopped
    environment:
      # 口令统一由 .env 注入（见 .env.example）；未设置时回退 root，与
      # application.yml 的 datasource.password 默认值保持一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      # create_table.sql 里只有 CREATE TABLE、没有 CREATE DATABASE。
      # MySQL 官方镜像会用 MYSQL_DATABASE 自动建库，initdb 脚本就建在这个库上
      MYSQL_DATABASE: miniurl_db
      TZ: Asia/Shanghai                # 对齐 JDBC URL 里的 serverTimezone
    ports:
      - "3306:3306"                    # 映射出来，开发期可用 Navicat/命令行直连
    volumes:
      # 数据持久化：容器删除/重建不丢库
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表（仅当数据卷为空时执行一次，已初始化过的卷不会再跑）
      # :ro = 容器内只读，防止容器误改宿主机脚本
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
    healthcheck:
      # 必须用 CMD-SHELL：$$ 经 compose 变成 $ 后交给 shell 展开 $MYSQL_ROOT_PASSWORD。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s               # 首次初始化（建库建表）较慢，先给它缓冲期

  # ---------- Redis 7 ----------
  redis:
    image: redis:7
    container_name: miniurl-redis
    restart: unless-stopped
    # --requirepass 对齐 application.yml 的 redis.password（同由 .env 注入）；
    # --appendonly yes 开启 AOF，重启不丢缓存（配合 /data 数据卷）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-root}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data               # AOF 持久化
    healthcheck:
      # 必须带 -a 认证：裸 redis-cli ping 在 NOAUTH 时虽报错但退出码是 0，
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: miniurl-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: [ "9090:9090" ]
    depends_on:
      # 只保证启动顺序：镜像未装 curl 配不了 healthcheck；Prometheus 抓取失败会自动重试，app 起来就有数据
      - miniurl-app
  grafana:
    image: grafana/grafana:latest
    container_name: miniurl-grafana
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}" }
    ports: [ "3000:3000" ]

  # ---------- MiniURL 应用 ----------
  miniurl-app:
    build:
      context: .                      # 复用项目根目录的 Dockerfile（多阶段构建）
      dockerfile: Dockerfile
    image: miniurl-app:latest         # 给构建产物固定 tag，后续可用 up（不重复构建）
    container_name: miniurl-app
    restart: unless-stopped
    ports:
      - "9191:9191"
    environment:
      # 时区对齐：JVM 默认 UTC，和 MySQL（Asia/Shanghai）差 8 小时会错位
      #（expireTime 过期判断、link_access_log 的 access_time、趋势查询窗口）。Dockerfile 还加了 -Duser.timezone 双保险
      TZ: Asia/Shanghai
      # 覆盖 application.yml 里写死的 localhost → 换成 compose 服务名。
      # 容器内 localhost 指容器自己，只有服务名能在 compose 网络里互通
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/miniurl_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      # HS256 签名密钥。这里刻意用 `:?` 而非 `:-`：未配置直接启动失败并给出提示，
      # 避免生产栈静默沿用 application.yml 里那个已随仓库公开的开发默认值——
      # 那个值人人可见，等同于没有鉴权。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置：请复制 .env.example 为 .env，填入 openssl rand -base64 48 生成的值}
      # 短链返回给客户端的对外地址（Spring 宽松绑定 → miniurl.base-url）：
      # nginx 是本栈对外入口（:80），base-url 默认 localhost 仅本机可点；局域网/手机访问
      # 时用环境变量 MINIURL_LAN_IP 覆盖（如 VM 上 .env 写 MINIURL_LAN_IP=192.168.100.3），
      # IP 变化只改 .env 不用动仓库；未设置回退 localhost（本地/CI 默认行为）
      MINIURL_BASE_URL: http://${MINIURL_LAN_IP:-localhost}
      # 安全：strict-mode=true（Spring 宽松绑定 → miniurl.security.strict-mode）。
      # 非可信源（白名单外）尝试伪造 X-Real-IP/X-Forwarded-For 直接拒绝而非仅审计；
      # 本栈流量走 nginx（172.16/12 白名单内），正常请求不受影响。application.yml 默认仍 false，
      # 本地开发/CI 走默认；容器生产栈这里显式开启
      MINIURL_SECURITY_STRICT_MODE: "true"

    depends_on:
      # 等依赖 healthcheck 通过（service_healthy）再启动应用，避免应用一启动就连库失败
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 说明：应用已引入 actuator（/actuator/health 可探活），但镜像未装 curl，故未配 healthcheck；
    # 应用日志写到容器内 /app/logs/miniurl.log（Dockerfile WORKDIR=/app，appuser 有写权限）

  # ---------- 前端静态服务 ----------
  frontend:
    build:
      context: ../../miniurl-frontend    # compose 文件在 miniurl-backend/miniurl/，前端在仓库根 miniurl-frontend/
      dockerfile: Dockerfile
    image: miniurl-frontend:latest
    container_name: miniurl-frontend
    restart: unless-stopped
    # 不对外暴露端口：所有流量经主 nginx 分流进入，前端容器只服务静态资源
    healthcheck:
      # busybox wget 探活；用 127.0.0.1 而非 localhost（容器内 localhost 可能解析到 ::1，
      # 而 nginx.conf 的 listen 80 默认只绑 IPv4，探活会失败）
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Nginx 反向代理 + 限速（对外入口） ----------
  nginx:
    image: nginx:alpine
    container_name: miniurl-nginx
    restart: unless-stopped
    ports:
      - "80:80"                       # 对外入口：业务接口 + 短链重定向全走 nginx
    volumes:
      # 只读挂载反代配置；改配置后 docker exec miniurl-nginx nginx -t 验证 + reload
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # 只保证启动顺序（app 未配 healthcheck，无法用 service_healthy）；
      # nginx 上游 miniurl-app:9191 在 compose 网络内自动解析，app 未就绪时短暂 502 属正常
      - miniurl-app
      # 前端同理：静态资源由 nginx 反向代理，仅保证启动顺序
      - frontend
    healthcheck:
      # busybox wget 探活；/actuator/health 在 nginx 配置里精确匹配免限速。
      # 探活必须用 127.0.0.1：容器内 localhost 解析到 ::1（IPv6），而挂载的 nginx.conf 只监听 IPv4
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 具名数据卷（docker volume ls 可查看；docker compose down 不会删除卷）
volumes:
  mysql-data:
  redis-data:


# ============================================================
# MiniURL CI — 单元测试 + Docker 镜像部署测试（三件套冒烟）
#
# 触发：push / PR 到 main，或手动 workflow_dispatch（Actions 页 Run workflow）
#
# job1 test               干净克隆上跑全量单元测试（./mvnw test）
# job2 docker-compose-test 依赖 job1，compose 构建应用镜像 + 起 mysql/redis/app
#                           + 健康检查 + 冒烟脚本，模拟容器化部署
#
# 零密钥、零第三方服务，纯 GitHub 托管 runner（ubuntu-latest）
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的后续提交取消还在跑的旧工作流，省 runner 时长
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------- job1：单元测试 ----------
  test:
    name: 单元测试 (mvnw test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: miniurl-backend/miniurl
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin) 并缓存 Maven 依赖
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven            # 缓存 ~/.m2，二次构建更快

      - name: 全量单元测试
        # --batch-mode 关闭交互提示；--no-transfer-progress 精简 Maven 下载日志
        run: ./mvnw --batch-mode --no-transfer-progress test

  # ---------- job2：Docker 镜像部署测试 ----------
  docker-compose-test:
    name: Docker 镜像部署测试 (三件套 + 冒烟)
    runs-on: ubuntu-latest
    needs: test                   # 单元测试过了才构建镜像
    timeout-minutes: 30
    defaults:
      run:
        working-directory: miniurl-backend/miniurl
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建应用镜像（多阶段 Dockerfile）
        # 只 build 应用镜像；mysql/redis 直接拉官方镜像，不重复构建
        run: docker compose build miniurl-app

      - name: 启动 MySQL + Redis + App（三件套，依赖 healthcheck）
        run: docker compose up -d mysql redis miniurl-app

      - name: 等待 App 健康检查通过（最多 90s）
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9191/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ App 健康，第 ${i}s 就绪"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App 90s 内未就绪，最近 40 行日志：" >&2
          docker compose logs --tail 40 miniurl-app >&2
          exit 1

      - name: 冒烟测试（smoke_status.sh）
        # 脚本在仓库根（不在 miniurl 子目录），覆盖根目录跑；BASE 指向 runner 宿主 9191
        working-directory: .
        run: bash smoke_status.sh

      - name: 清理容器与数据卷（无论成败都执行）
        if: always()
        run: docker compose down -v

# ============================================================
# MiniURL CI — 单元测试 + Docker 镜像部署测试（三件套冒烟）
#
# 触发：push / PR 到 main，或手动 workflow_dispatch（Actions 页 Run workflow）
#
# job1 test               干净克隆上跑 Spotless 格式检查 + 全量单元测试（./mvnw spotless:check test）
# job2 docker-compose-test 依赖 job1，compose 构建应用镜像 + 起 mysql/redis/app
#                           + 健康检查 + 冒烟脚本，验证容器化部署
#
# 两个 job 都用 GitHub 托管 runner。不用 self-hosted 的原因：仓库是公开的，
#   fork 出来的 PR 能在 self-hosted runner 上执行任意代码，而 runner 所在机器上
#   有常驻服务与 .env —— 等于把内网执行权交给任何提 PR 的人。托管 runner 每次
#   都是干净的一次性环境，天然规避该风险；公开仓库的 runner 分钟数也不计费。
#   代价：Dockerfile 的 --mount=type=cache 不跨 job 保留，每次构建要重下 Maven
#   依赖（慢几分钟），换来的是不需要维护一台常开的构建机。
#
# 零密钥、零第三方服务
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的后续提交取消还在跑的旧工作流，省 runner 时长
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------- job1：单元测试 ----------
  test:
    name: 单元测试 (mvnw test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: miniurl-backend/miniurl
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (Temurin) 并缓存 Maven 依赖
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven            # 缓存 ~/.m2，二次构建更快

      - name: Spotless 格式检查
        # 纯规则模式（removeUnusedImports/trimTrailingWhitespace/endWithNewline），不放行未格式化代码进 CI
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: 全量单元测试
        # --batch-mode 关闭交互提示；--no-transfer-progress 精简 Maven 下载日志
        run: ./mvnw --batch-mode --no-transfer-progress test

  # ---------- job2：Docker 镜像部署测试 ----------
  docker-compose-test:
    name: Docker 镜像部署测试 (三件套 + 冒烟)
    runs-on: ubuntu-latest
    needs: test                   # 单元测试过了才构建镜像
    timeout-minutes: 30
    # 项目名前缀 + docker-compose.ci.yml 的容器名/端口覆盖，是早期 self-hosted
    # 时期为避开同机常驻的生产栈而加的。托管 runner 是干净环境，这些隔离已无
    # 对象，属冗余但无害；本次不动是为了让 runner 切换保持单一变量、便于验证
    env:
      COMPOSE_PROJECT_NAME: miniurl-ci
    defaults:
      run:
        working-directory: miniurl-backend/miniurl
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 现场生成 JWT_SECRET
        # docker-compose.yml 里 JWT_SECRET 用 `${JWT_SECRET:?...}` 声明为必填，
        # 而 compose 在解析阶段就会插值整个文件（连 build 也逃不掉），所以必须在
        # 第一条 compose 命令之前注入。
        # 这里现场随机生成而非用 Repository Secret：CI 的密钥没有任何跨次稳定性
        # 需求（每次都是隔离的一次性环境），现场生成省掉一个配置项，也消除了
        # "secret 忘配导致 CI 红" 的故障源。
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: 构建应用镜像（多阶段 Dockerfile）
        # 只 build 应用镜像；mysql/redis 直接拉官方镜像，不重复构建。
        # -f ci 覆盖：镜像 tag 用 miniurl-app:ci，不动生产栈的 :latest
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build miniurl-app

      - name: 启动 MySQL + Redis + App（三件套，依赖 healthcheck）
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d mysql redis miniurl-app

      - name: 等待 App 健康检查通过（最多 90s）
        # CI 端口被覆盖到 19191（隔离生产 9191）
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:19191/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ App 健康，第 ${i}s 就绪"
              exit 0
            fi
            sleep 1
          done
          echo "❌ App 90s 内未就绪，最近 40 行日志：" >&2
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 40 miniurl-app >&2
          exit 1

      - name: 冒烟测试（smoke_status.sh）
        # 脚本在仓库根（不在 miniurl 子目录），覆盖根目录跑；BASE 指向 CI 隔离端口 19191
        working-directory: .
        env:
          BASE: http://localhost:19191
        run: bash smoke_status.sh

      - name: 清理容器与数据卷（无论成败都执行）
        # 托管 runner 随实例销毁，容器/卷本就会消失；此步是显式收尾，
        # 让 workflow 的生命周期自成闭环，不依赖 runner 的回收时机
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
